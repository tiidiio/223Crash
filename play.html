<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>223CRASH — 223GAMING</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">223<span>CRASH</span></div>
    <div class="balance"><span class="balance-label" data-i18n="balance.label">SOLDE</span><span id="balance-display">—</span></div>
    <div class="top-actions">
      <span id="status-chip" class="chip" data-state="warn" role="status"><i class="dot" aria-hidden="true"></i><span id="status-text"></span></span>
      <button id="sound-btn" type="button" class="icon-btn" aria-pressed="false" data-i18n-aria="aria.sound">🔇</button>
      <button id="menu-btn" type="button" class="icon-btn" aria-haspopup="dialog" data-i18n-aria="aria.menu">☰</button>
    </div>
  </header>
  <div id="conn-banner" class="banner" role="status" hidden data-i18n="conn.lost"></div>

  <div class="layout">
    <section id="history" class="history" role="list" data-i18n-aria="aria.history"></section>

    <section id="stage" class="stage" data-phase="idle">
      <canvas id="stage-canvas"></canvas>
      <div class="stage-overlay">
        <div id="mult" class="mult" data-state="idle">1.00x</div>
        <div id="phase" class="phase"></div>
      </div>
      <div class="countdown"><div id="count-bar" class="count-bar"></div></div>
    </section>

    <main id="panels" class="panels"></main>
  </div>
</div>

<dialog id="menu-dlg" class="dlg" aria-labelledby="menu-title">
  <div class="dlg-body">
    <h2 id="menu-title" data-i18n="menu.title"></h2>
    <div class="row"><label for="lang-select" data-i18n="menu.language"></label><select id="lang-select"></select></div>
    <div class="row"><span data-i18n="menu.sound"></span><button id="set-sound" type="button" class="btn" aria-pressed="false"></button></div>
    <div class="row"><label for="vol" data-i18n="menu.volume"></label><input id="vol" type="range" min="0" max="100" step="5"></div>
    <div class="row" id="fs-row"><span data-i18n="menu.fullscreen"></span><button id="fs-btn" type="button" class="btn" data-i18n-aria="menu.fullscreen">⛶</button></div>
    <div class="row-btns">
      <button id="open-rules" type="button" class="btn" data-i18n="menu.rules"></button>
      <button id="open-fair" type="button" class="btn" data-i18n="menu.fair"></button>
    </div>
    <div class="dlg-actions"><button id="menu-close" type="button" class="btn btn-main" data-i18n="menu.close"></button></div>
  </div>
</dialog>

<dialog id="fair-dlg" class="dlg" aria-labelledby="fair-title">
  <div class="dlg-body">
    <h2 id="fair-title" data-i18n="fair.title"></h2>
    <dl>
      <dt data-i18n="fair.round"></dt><dd id="fair-round">—</dd>
      <dt data-i18n="fair.hash"></dt><dd id="fair-hash">—</dd>
      <dt data-i18n="fair.last"></dt><dd id="fair-last">—</dd>
    </dl>
    <p class="dim" data-i18n="fair.note"></p>
    <div class="dlg-actions">
      <button id="fair-copy" type="button" class="btn" data-i18n="fair.copy"></button>
      <button id="fair-close" type="button" class="btn btn-main" data-i18n="fair.close"></button>
    </div>
  </div>
</dialog>

<dialog id="rules-dlg" class="dlg" aria-labelledby="rules-title">
  <div class="dlg-body">
    <h2 id="rules-title" data-i18n="rules.title"></h2>
    <p class="rules" data-i18n="rules.p1"></p>
    <p class="rules" data-i18n="rules.p2"></p>
    <p class="rules" data-i18n="rules.p3"></p>
    <p class="rules" data-i18n="rules.p4"></p>
    <div class="dlg-actions"><button id="rules-close" type="button" class="btn btn-main" data-i18n="menu.close"></button></div>
  </div>
</dialog>

<div id="replaced" class="overlay" hidden>
  <div class="overlay-box">
    <h2 data-i18n="replaced.title"></h2>
    <p data-i18n="replaced.body"></p>
    <button id="replaced-reload" type="button" class="btn btn-main" data-i18n="replaced.btn"></button>
  </div>
</div>

<div id="fatal" class="overlay" hidden>
  <div class="overlay-box">
    <h2 data-i18n="fatal.title"></h2>
    <p id="fatal-msg"></p>
  </div>
</div>

<div id="sr-live" class="sr-only" role="status" aria-live="polite"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="ui-main.js"></script>
</body>
</html>
